        - Building robust and scalable data pipelines — Designing and maintaining end-to-end data infrastructure for clinical VR datasets, spanning ingestion, validation, versioning, and serving layers across multi-regional deployments.
        - Developing machine learning models — Researching and implementing models for eye-tracking signal processing and clinical screening applications, including time-series classification, self-supervised learning, and psychometric score derivation from raw biometric data.
        - Implementing internal AI tools — Building knowledge graph systems, deep research pipelines, and autonomous data science agents to accelerate clinical research workflows and reduce manual analytical overhead.
        - Developing the scientific product strategy — Owning the full arc from research conceptualization and study design through regulatory-aware productionisation, bridging clinical science and engineering stakeholders.
